  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# ─── 시저 링키지 관절 궤적 ─────────────────────────────────
# `scissor_driver` 노드가 내는 **종동체 지령**이다. 사람이 쏠 일은 없다.
# 시저 관절 20개를 메시지 하나로 묶는다 — 20관절이 한 틱에 함께 움직여야
# X자가 어긋나 보이지 않는다 (성능은 토픽을 나눠도 같다).
# 시저는 닫힌 루프라 URDF 로 못 쓰고, dartsim 이 mimic 을 지원하지 않아
# 이렇게 위치제어로 따라가게 한다 — 자세한 이유는 scissor_driver.py 참조.
# 이 브리지가 없으면 X자가 접힌 채(θ=0) 있을 뿐, 주행·추정은 영향이 없다.

- ros_topic_name: "/scissor/traj"
  gz_topic_name: "/scissor/traj"
  ros_type_name: "trajectory_msgs/msg/JointTrajectory"
  gz_type_name: "gz.msgs.JointTrajectory"
  direction: ROS_TO_GZ

# 관절 엔코더 — 상하·회전·리니어축은 휠 오도메트리로 알 수 없다.
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
